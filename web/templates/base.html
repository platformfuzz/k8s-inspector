<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - {{block "title" .}}{{end}}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  {{block "head" .}}{{end}}
</head>

<body class="theme-{{.Theme}}">
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <h1>{{.Title}}</h1>
        <span class="version">v{{.Version}}</span>
      </div>
      <div class="nav-links">
        <a href="/dashboard" class="nav-link {{if eq .Request.URL.Path " /dashboard"}}active{{end}}">Dashboard</a>
        <a href="/inspector" class="nav-link {{if eq .Request.URL.Path " /inspector"}}active{{end}}">Inspector</a>
      </div>
    </div>
  </nav>
  <main class="main-content">
    {{block "content" .}}{{end}}
  </main>
  <footer class="footer">
    <p>&copy; 2026 Platform Fuzz - k8s-inspector</p>
  </footer>
  <script src="/static/js/dashboard.js"></script>
  {{block "scripts" .}}{{end}}
</body>

</html>
